# Rate limiting — musi być w kontekście http (przed blokami server)
limit_req_zone $binary_remote_addr zone=api_reviews:10m rate=10r/m;

server {
    listen 80;
    server_name willa-ewa.pl www.willa-ewa.pl;

    # Przekierowanie HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name willa-ewa.pl www.willa-ewa.pl;

    # SSL — certbot uzupełni te ścieżki automatycznie
    ssl_certificate     /etc/letsencrypt/live/willa-ewa.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/willa-ewa.pl/privkey.pem;

    # Nowoczesne ustawienia SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Katalog z plikami klienta (vite build output)
    root /var/www/WillaEwa/client/dist;
    index index.html;

    # Nagłówki bezpieczeństwa
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Pliki statyczne
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache dla statycznych assetów
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Endpoint dodawania opinii — z rate limitingiem
    location /api/add-review {
        limit_req zone=api_reviews burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpointy admina i autoryzacji
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel admina i logowanie
    location ~ ^/(admin|login) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Zablokuj dostęp do ukrytych plików
    location ~ /\. {
        deny all;
    }

    # Logi
    access_log /var/log/nginx/willa-ewa.access.log;
    error_log  /var/log/nginx/willa-ewa.error.log;
}
