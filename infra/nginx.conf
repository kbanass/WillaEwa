limit_req_zone $binary_remote_addr zone=api_reviews:10m rate=10r/m;

# ============================================================
# DEFAULT SERVER — łapie wszystko, co nie pasuje do nazwy
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Self-signed cert — wystarczy, bo i tak zamykamy połączenie
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    return 444;
}

# ============================================================
# WŁAŚCIWA STRONA
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name willaewanadmorzem.pl www.willaewanadmorzem.pl;

    return 301 https://willaewanadmorzem.pl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name willaewanadmorzem.pl www.willaewanadmorzem.pl;

    ssl_certificate     /etc/letsencrypt/live/willaewanadmorzem.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/willaewanadmorzem.pl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/WillaEwa/client/dist;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /opinie {
        try_files /opinie.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/add-review {
        limit_req zone=api_reviews burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host willaewanadmorzem.pl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host willaewanadmorzem.pl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(panel|login) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host willaewanadmorzem.pl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(admin|login)\.html$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/willa-ewa.access.log;
    error_log  /var/log/nginx/willa-ewa.error.log;
}