server {
    listen 80;
    server_name twojadomena.pl www.twojadomena.pl;

    # Przekierowanie HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name twojadomena.pl www.twojadomena.pl;

    # SSL — certbot uzupełni te ścieżki automatycznie
    ssl_certificate     /etc/letsencrypt/live/twojadomena.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twojadomena.pl/privkey.pem;

    # Katalog z plikami klienta
    root /var/www/krynica-morska/client;
    index index.html;

    # Bezpieczeństwo
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-XSS-Protection "1; mode=block";

    # Rate limiting dla API
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;

    # Pliki statyczne
    location / {
        try_files $uri $uri/ =404;

        # Cache dla statycznych assetów
        location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Endpoint opinii — z rate limitingiem
    location /api/opinie {
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpointy admina
    location /api/admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel admina
    location /admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Zablokuj dostęp do ukrytych plików
    location ~ /\. {
        deny all;
    }

    # Logi
    access_log /var/log/nginx/krynica-morska.access.log;
    error_log  /var/log/nginx/krynica-morska.error.log;
}